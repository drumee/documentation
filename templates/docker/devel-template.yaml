services:
  drumee:
    image: drumee/devel:latest
    container_name: drumee-devel 
    ports:   
      - "53:53/udp"
      - "53:53/tcp"
      - "443:443/tcp"
      - "80:80/tcp"
      - "10000:10000/udp"
      - "5222:5222/tcp"

    user: "${UID}:${GID}"

    environment:
      # This setup is intend for development. 
      - "PRIVATE_IP4=127.0.0.1"  # You can use a private IP address so that your server ia reachable through your LAN
      - DRUMEE_DOMAIN_NAME=local.drumee  # Default domain name, don't use public domain
      - DRUMEE_REPO=evaluation.drumee.io # DO NOT CHANGE
      - INFRA_COMPONENTS=all # DO NOT CHANGE
      - DRUMEE_DESCRIPTION=My Drumee Developemt Server # Set yours
      - ADMIN_EMAIL=me@examle.org # MANDATORY, set yours. 
      - ACME_EMAIL_ACCOUNT=me@examle.org # default to ADMIN_EMAIL. Not need if only private domain
      - STORAGE_BACKUP="" # Optonal, format [user@backup.org:]/path/to/backup 
      - DB_BACKUP="" # Optonal, format [user@backup.org:]/path/to/backup 
      - INSTANCE_TYPE=devel
      
    volumes:
      # Change host volumes accordingly to you configs.
      # It's recommanded to have separated volumes
      # If possible, use good io perfomance for database volume 
      # DO NOT CHANGE right hand values
      - /var/lib/drumee/data/storage/db:/srv/db
      - /var/lib/drumee/data/storage/data:/data
      - /var/lib/drumee/data/storage:/exchangearea
      - "${HOME}/.config/drumee-build:/mnt/devel"
      - "${HOME}:${HOME}" :ro
    entrypoint: /var/lib/drumee/init.d/loader  # Comment this
    #entrypoint: /bin/bash                     # and uncomment this for debug or trouble shootiing
    stdin_open: true 
    tty: true 
    restart: unless-stopped
